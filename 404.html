<!DOCTYPE html>

<title>Opening CUETAce...</title>
<meta name="robots" content="noindex">
<script>
  (function () {
    var path = window.location.pathname + window.location.search + window.location.hash;
    if (!path || path === '/') path = '/';
    window.location.replace('/?spaPath=' + encodeURIComponent(path));
  })();
</script>
</head>
